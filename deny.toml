# cargo-deny — supply-chain audit. Run: `cargo deny check`.
# CI runs `check advisories bans licenses sources`.

[advisories]
version = 2
yanked = "warn"
ignore = [
    # proc-macro-error2 unmaintained — transitive via validator_derive → validator.
    # No fix available upstream. Re-check quarterly; drop this entry once
    # `validator` migrates to `manyhow` or `proc-macro2-diagnostics`.
    "RUSTSEC-2026-0173",
    # backoff / instant unmaintained — transitive via swiftide-core 0.32.1.
    # No fix available in the current swiftide release line; re-check when
    # upgrading swiftide and drop these entries once it removes backoff.
    "RUSTSEC-2025-0012",
    "RUSTSEC-2024-0384",
]

[bans]
multiple-versions = "warn"
# Wildcards are common in transitive graphs; warn but don't block.
wildcards = "warn"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MITNFA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
    "BlueOak-1.0.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
