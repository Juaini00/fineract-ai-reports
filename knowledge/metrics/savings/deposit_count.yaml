id: savings.deposit_count
domain: savings
status: approved_mvp
description: Count of non-reversed savings deposit transactions.
data_areas:
  - savings_transactions
source_table: m_savings_account_transaction
source_columns:
  - id
  - transaction_type_enum
  - is_reversed
  - transaction_date
  - office_id
expression: COUNT(*)
filters:
  - m_savings_account_transaction.transaction_type_enum = 1
  - m_savings_account_transaction.is_reversed = false
grouping_compatible:
  - currency_code
  - office_id
  - product_id
sensitivity: public_business
checks:
  - id: source_table_in_scope
    rule: source_table must be included by savings_transactions data scope.
  - id: deposit_filter_declared
    rule: filters must include transaction_type_enum = 1 and is_reversed = false.
  - id: public_output_only
    rule: metric sensitivity must remain public_business.
