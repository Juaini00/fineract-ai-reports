id: savings.charge_count_by_type
database: fineract
sql_file: queries/savings/charge_count_by_type.sql
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_charges_fees
tables:
  - m_savings_account_charge
  - m_savings_account
  - m_client
  - m_charge
metrics:
  - savings.charge_count
  - savings.charge_amount_outstanding
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: charge_name
    type: string
    required: true
required_filters:
  - m_client.office_id constrained to authorized office_ids
  - m_charge.name matched case-insensitively against the requested charge type
  - only active charge rows are counted
output_fields:
  - name: charge_count
    type: bigint
    sensitivity: public_business
  - name: savings_account_count
    type: bigint
    sensitivity: public_business
  - name: amount_outstanding_total
    type: decimal
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain c.office_id with ANY($1::bigint[]).
  - id: charge_type_filter_is_bound
    rule: SQL must constrain ch.name with a bound, case-insensitive $2::text comparison.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: no_identity_fields
    rule: Query must aggregate only; it must not output client or staff identity.
