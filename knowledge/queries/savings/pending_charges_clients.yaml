id: savings.pending_charges_clients
database: fineract
sql_file: queries/savings/pending_charges_clients.sql
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_charges_fees
tables:
  - m_savings_account_charge
  - m_savings_account
  - m_client
  - m_office
  - m_charge
metrics:
  - savings.charge_amount_outstanding
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: as_of_date
    type: date
    required: false
  - name: limit
    type: integer
    required: false
required_filters:
  - m_savings_account_charge.waived = false
  - m_savings_account_charge.is_paid_derived = false
  - m_savings_account_charge.is_active = true
  - m_savings_account_charge.amount_outstanding_derived > 0
  - m_client.office_id constrained to authorized office_ids
  - as_of_date is a reference date for days_overdue only, never a row filter
  - ordered by amount_outstanding descending, charge_due_date ascending (NULLS LAST), id ascending
  - bounded by limit when provided
output_fields:
  - name: client_id
    type: bigint
    sensitivity: public_business
  - name: client_display_name
    type: string
    sensitivity: pii
  - name: office_id
    type: bigint
    sensitivity: public_business
  - name: office_name
    type: string
    sensitivity: public_business
  - name: savings_account_id
    type: bigint
    sensitivity: public_business
  - name: savings_account_charge_id
    type: bigint
    sensitivity: public_business
    description: Primary key of the account charge instance, not the catalogue charge id.
  - name: charge_definition_id
    type: bigint
    sensitivity: public_business
    description: Catalogue charge id from m_charge.
  - name: charge_name
    type: string
    sensitivity: public_business
  - name: is_penalty
    type: boolean
    sensitivity: public_business
  - name: charge_timing_enum
    type: integer
    sensitivity: public_business
    description: Raw m_savings_account_charge.charge_time_enum value. The label mapping
      (one-off, weekly, monthly, withdrawal fee, ...) is unconfirmed against Fineract source,
      so the integer is emitted as-is and must not be rendered as a guessed name.
  - name: currency_code
    type: string
    sensitivity: public_business
  - name: currency_digits
    type: integer
    sensitivity: public_business
    description: m_savings_account.currency_digits, the precision the account was booked at.
  - name: currency_display_symbol
    type: string
    sensitivity: public_business
    description: Nullable m_organisation_currency.display_symbol; rendering falls back to code.
  - name: amount_due_current
    type: decimal
    sensitivity: public_business
    description: m_savings_account_charge.amount, the levied amount of the current or next
      occurrence. For recurring charges this is not a lifetime total; Fineract stores no
      lifetime levied total.
  - name: amount_paid
    type: decimal
    sensitivity: public_business
    description: Cumulative amount paid across all occurrences.
  - name: amount_waived
    type: decimal
    sensitivity: public_business
  - name: amount_written_off
    type: decimal
    sensitivity: public_business
  - name: amount_levied_total
    type: decimal
    sensitivity: public_business
    description: paid + waived + written_off + outstanding, the total ever levied.
  - name: amount_outstanding
    type: decimal
    sensitivity: public_business
  - name: due_date
    type: date
    sensitivity: public_business
    description: For one-off charges the date it fell due; for recurring charges the next
      occurrence, which may be in the future while the charge is still outstanding.
  - name: days_overdue
    type: integer
    sensitivity: public_business
    description: as_of_date minus due_date, clamped at zero, NULL when due_date is NULL.
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
timeout_ms: 3000
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: unpaid_filter_declared
    rule: SQL must filter waived = false, is_paid_derived = false, is_active = true and
      amount_outstanding_derived > 0, and must not filter on charge_due_date.
  - id: limit_is_bound
    rule: SQL must use a bound LIMIT parameter.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: currency_join_fanout_safe
    rule: Any join to m_organisation_currency must use LEFT JOIN LATERAL with LIMIT 1.
