id: savings.deposit_monthly_breakdown
database: fineract
sql_file: queries/savings/deposit_monthly_breakdown.sql
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
tables:
  - m_savings_account_transaction
  - m_savings_account
  - m_office
metrics:
  - savings.deposit_amount
  - savings.deposit_count
parameters:
  - name: from_date
    type: date
    required: true
  - name: to_date
    type: date
    required: true
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: currency_code
    type: string
    required: false
  - name: product_ids
    type: array_bigint
    required: false
output_fields:
  - name: month_start
    type: date
    sensitivity: public_business
  - name: total_deposit_amount
    type: decimal
    sensitivity: public_business
  - name: deposit_count
    type: integer
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
timeout_ms: 5000
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: date_filter_is_bound
    rule: SQL must constrain transaction_date BETWEEN from_date and to_date.
  - id: office_filter_is_bound
    rule: SQL must constrain authorized office_ids.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
