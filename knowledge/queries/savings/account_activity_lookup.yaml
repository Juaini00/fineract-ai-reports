id: savings.account_activity_lookup
database: fineract
sql_file: queries/savings/account_activity_lookup.sql
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
tables:
  - m_savings_account_transaction
  - m_savings_account
  - m_savings_product
  - m_client
metrics:
  - savings.deposit_count
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: search
    type: string
    required: true
  - name: product_name
    type: string
    required: true
  - name: latest_transaction_amount
    type: string
    required: true
output_fields:
  - name: savings_account_id
    type: bigint
    sensitivity: public_business
  - name: transaction_count
    type: bigint
    sensitivity: public_business
timeout_ms: 3000
