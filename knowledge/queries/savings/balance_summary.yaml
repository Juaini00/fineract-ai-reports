id: savings.balance_summary
database: fineract
sql_file: queries/savings/balance_summary.sql
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
tables:
  - m_savings_account
  - m_client
metrics:
  - savings.account_balance
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: currency_code
    type: string
    required: false
  - name: product_ids
    type: array_bigint
    required: false
output_fields:
  - name: account_count
    type: bigint
    sensitivity: public_business
  - name: total_balance
    type: decimal
    sensitivity: public_business
  - name: average_balance
    type: decimal
    sensitivity: public_business
  - name: max_balance
    type: decimal
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  snapshot_only: true
timeout_ms: 5000
cost_class: medium
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain authorized office_ids.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
