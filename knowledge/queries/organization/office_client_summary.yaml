id: organization.office_client_summary
database: fineract
sql_file: queries/organization/office_client_summary.sql
data_areas:
  - organization_foundation
  - client_foundation
tables:
  - m_office
  - m_client
metrics:
  - client.lifecycle_count
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: limit
    type: integer
    required: true
  # User-supplied narrowing, not authorization. It is ANDed after the
  # unconditional `o.id = ANY($1::bigint[])` scope predicate, so it can only
  # ever shrink the authorized set. Unbound it binds NULL and the predicate
  # short-circuits, leaving the statement text identical.
  - name: office_name
    type: string
    required: false
output_fields:
  - name: office_id
    type: bigint
    sensitivity: public_business
  - name: office_name
    type: string
    sensitivity: public_business
  - name: active_clients
    type: bigint
    sensitivity: public_business
  - name: pending_clients
    type: bigint
    sensitivity: public_business
  - name: closed_clients
    type: bigint
    sensitivity: public_business
  - name: total_clients
    type: bigint
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain o.id with ANY($1::bigint[]).
  - id: limit_is_bound
    rule: SQL must use bound LIMIT $2.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: office_name_narrows_only
    rule: >-
      office_name is ANDed after the authorized office_ids predicate and binds
      NULL when absent, so it can only narrow within authorized_scope, never
      widen it. Match is exact and case-insensitive on the office's own name;
      child offices are not included.
