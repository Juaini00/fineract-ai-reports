id: organization.office_activity_ranking
database: fineract
sql_file: queries/organization/office_activity_ranking.sql
data_areas:
  - organization_foundation
  - client_foundation
tables:
  - m_office
  - m_savings_account_transaction
metrics:
  - savings.transaction_count
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: from_date
    type: date
    required: true
  - name: to_date
    type: date
    required: true
  - name: limit
    type: integer
    required: true
output_fields:
  - name: office_id
    type: bigint
    sensitivity: public_business
  - name: office_name
    type: string
    sensitivity: public_business
  - name: transaction_count
    type: bigint
    sensitivity: public_business
  - name: deposit_total
    type: decimal
    sensitivity: public_business
  - name: withdrawal_total
    type: decimal
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 5000
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain o.id with ANY($1::bigint[]).
  - id: date_filter_is_bound
    rule: SQL must constrain t.transaction_date BETWEEN $2::date AND $3::date.
  - id: limit_is_bound
    rule: SQL must use bound LIMIT $4.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
