id: organization.hierarchy_summary
database: fineract
sql_file: queries/organization/hierarchy_summary.sql
data_areas:
  - organization_foundation
tables:
  - m_office
metrics:
  - organization.office_count
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
output_fields:
  - name: total_office_count
    type: bigint
    sensitivity: public_business
  - name: root_office_count
    type: bigint
    sensitivity: public_business
  - name: leaf_office_count
    type: bigint
    sensitivity: public_business
  - name: max_hierarchy_depth
    type: bigint
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  snapshot_only: true
timeout_ms: 3000
cost_class: low
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain m_office.id with authorized office_ids.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: no_identity_fields
    rule: Query must not output office external ids, staff names, emails, mobile numbers.
