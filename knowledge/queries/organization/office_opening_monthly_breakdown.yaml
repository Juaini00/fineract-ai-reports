id: organization.office_opening_monthly_breakdown
database: fineract
sql_file: queries/organization/office_opening_monthly_breakdown.sql
data_areas:
  - organization_foundation
tables:
  - m_office
metrics:
  - organization.office_count
parameters:
  - name: from_date
    type: date
    required: true
  - name: to_date
    type: date
    required: true
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
output_fields:
  - name: month_start
    type: date
    sensitivity: public_business
  - name: opened_office_count
    type: bigint
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
cost_class: low
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: date_filter_is_bound
    rule: SQL must constrain o.opening_date BETWEEN $1::date AND $2::date.
  - id: office_filter_is_bound
    rule: SQL must constrain m_office.id with ANY($3::bigint[]).
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: no_identity_fields
    rule: Query must not output office names, external ids, or staff identity.
