id: organization.office_name_lookup
database: fineract
sql_file: queries/organization/office_name_lookup.sql
data_areas:
  - organization_foundation
tables:
  - m_office
  - m_staff
metrics:
  - organization.office_count
  - organization.active_staff_count
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: office_name
    type: string
    required: true
required_filters:
  - m_office.id constrained to authorized office_ids
  - m_office.name matched case-insensitively against the requested office name
output_fields:
  - name: office_count
    type: bigint
    sensitivity: public_business
  - name: root_office_count
    type: bigint
    sensitivity: public_business
  - name: oldest_opening_date
    type: date
    sensitivity: public_business
  - name: active_staff_count
    type: bigint
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  snapshot_only: true
timeout_ms: 3000
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain o.id with authorized office_ids.
  - id: office_name_filter_is_bound
    rule: SQL must constrain o.name with a bound, case-insensitive $2::text comparison.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: no_identity_fields
    rule: Query must not output staff names, emails, mobile numbers, or external ids.
