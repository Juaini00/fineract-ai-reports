id: organization.office_list_basic
database: fineract
sql_file: queries/organization/office_list_basic.sql
data_areas:
  - organization_foundation
tables:
  - m_office
metrics:
  - organization.office_count
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: limit
    type: integer
    required: true
output_fields:
  - name: office_id
    type: bigint
    sensitivity: public_business
  - name: office_name
    type: string
    sensitivity: public_business
  - name: parent_id
    type: bigint
    sensitivity: public_business
  - name: opening_date
    type: date
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
cost_class: low
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain o.id with ANY($1::bigint[]).
  - id: limit_is_bound
    rule: SQL must use bound LIMIT $2.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: no_identity_fields
    rule: Query must not output staff or client identity fields.
