id: client.top_n_by_savings_balance
database: fineract
sql_file: queries/client/top_n_by_savings_balance.sql
data_areas:
  - client_foundation
  - organization_foundation
tables:
  - m_client
  - m_savings_account
  - m_office
metrics:
  - savings.balance_total
parameters:
  - name: office_ids
    type: array_bigint
    required: true
    source: authorized_scope
  - name: currency_code
    type: string
    required: false
  - name: limit
    type: integer
    required: true
output_fields:
  - name: client_id
    type: bigint
    sensitivity: pii
  - name: client_display_name
    type: string
    sensitivity: pii
  - name: office_id
    type: bigint
    sensitivity: public_business
  - name: office_name
    type: string
    sensitivity: public_business
  - name: currency_code
    type: string
    sensitivity: public_business
  - name: account_count
    type: bigint
    sensitivity: public_business
  - name: total_balance
    type: decimal
    sensitivity: public_business
guards:
  select_only: true
  single_statement: true
  require_office_filter: true
  parameterized_only: true
timeout_ms: 3000
cost_class: medium
checks:
  - id: sql_file_exists
    rule: sql_file must exist under queries/.
  - id: sql_is_select_only
    rule: SQL must be one SELECT statement and contain no unsafe command.
  - id: office_filter_is_bound
    rule: SQL must constrain c.office_id with ANY($1::bigint[]).
  - id: limit_is_bound
    rule: SQL must use bound LIMIT $3.
  - id: output_columns_match_contract
    rule: Prepared SQL output columns must equal output_fields order.
  - id: pii_columns_labelled
    rule: client_id and client_display_name output fields must be sensitivity=pii.
