id: client_activation_top_n_offices
status: approved_mvp
domain: client
display_name: Top Offices by Client Activations
description: Return the offices with the highest number of activated clients in a date range within the caller's authorized office scope.
data_areas:
  - client_foundation
  - organization_foundation
required_api_capability: client_activation_top_n_offices
query_id: client.activation_top_n_offices
metrics:
  - client.lifecycle_count
output_mode: top_n
request_shape:
  operation: rank
  subject: office
  grouping: office
  output: ranking
  pii: none
examples:
  - Top 5 offices by new client activations this month.
  - Which offices onboarded the most clients last quarter?
  - Show top 10 offices by client activations from 2026-01-01 to 2026-06-30.
supported_intents:
  - top offices by client activation count in a date range
  - ranking of offices by newly activated clients
unsupported_intents:
  - client identity lookup by name
  - client contact information
required_parameters:
  - from_date
  - to_date
  - limit
optional_parameters:
  - office_ids
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  max_date_range_days: 366
  max_limit: 100
pii:
  returns_pii: false
cost_class: low
clarification:
  missing_parameters:
    - from_date
    - to_date
    - limit
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: required_parameters_match_query
    rule: required_parameters must be declared as required query parameters.
  - id: no_pii_output
    rule: query output fields must not expose client identity.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
