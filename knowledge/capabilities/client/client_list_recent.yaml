id: client_list_recent
status: approved_mvp
domain: client
display_name: Recently Activated Clients
description: List recently activated clients in the caller's authorized office scope, most recently activated first, with no ranking metric required.
data_areas:
  - client_foundation
  - organization_foundation
required_api_capability: client_list_recent
query_id: client.client_list_recent
metrics:
  - client.client_lifecycle_count
output_mode: list
request_shape:
  operation: list
  subject: client
  grouping: none
  output: list
  pii: client_identity
examples:
  - Show me the most recently activated clients.
  - List new clients this year.
  - Recently onboarded clients in my offices.
supported_intents:
  - plain browse/list of recently activated clients with no ranking metric
unsupported_intents:
  - clients ranked by a savings or deposit metric
  - client identity lookup by name
required_parameters:
  - limit
optional_parameters:
  - office_ids
defaults:
  authorized_scope_only: true
  default_limit: 50
guards:
  require_office_scope: true
  max_limit: 200
  pii:
    returns_pii: true
    never_return:
      - account_no
      - external_id
      - mobile_no
      - email_address
cost_class: low
clarification:
  missing_parameters: []
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: required_parameters_match_query
    rule: required_parameters must be declared as required query parameters.
  - id: pii_gated
    rule: pii output fields must be redacted when caller lacks can_view_pii.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
