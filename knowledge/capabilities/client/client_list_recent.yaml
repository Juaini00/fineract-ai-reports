id: client_list_recent
status: approved_mvp
domain: client
display_name: Client List by Office, Newest First
# The SQL restricts nothing by date. It returns every active client in the
# caller's office scope, optionally narrowed to one named office, and only
# *orders* by activation date. The former wording ("Recently Activated
# Clients") described a filter that does not exist, and the reranker — which
# reads this text, not the SQL — refused "show me all clients from <office>"
# because of it.
description: List active clients in the caller's authorized office scope, optionally narrowed to one named
  office, ordered by activation date newest first. Returns every active client in scope up to the row cap;
  it does not restrict the rows to a recent period.
data_areas:
- client_foundation
- organization_foundation
required_api_capability: client_list_recent
query_id: client.client_list_recent
metrics:
- client.client_lifecycle_count
output_mode: list
request_shape:
  operation: list
  subject: client
  grouping: none
  output: list
  pii: client_identity
examples:
- Show me all clients from Head Office.
- List every client in office Head Office.
- Tampilkan semua nasabah di kantor Head Office.
- Daftar seluruh nasabah pada kantor Head Office.
- Show me the clients in my offices.
- Show me the most recently activated clients.
- List new clients this year.
- Recently onboarded clients in my offices.
- Nasabah baru yang baru diaktivasi.
- List the newest clients from office Head Office.
supported_intents:
- plain browse/list of active clients with no ranking metric
- every active client in one named office, unranked
- every active client across the caller's office scope, unranked
- newest or most recently activated clients, which this capability serves by sort order
unsupported_intents:
- clients ranked by a savings or deposit metric
- client identity lookup by name
- clients activated strictly within a named date range, which this capability cannot restrict
defaults:
  authorized_scope_only: true
  default_limit: 50
guards:
  require_office_scope: true
  max_limit: 200
  pii:
    returns_pii: true
    never_return:
    - account_no
    - external_id
    - mobile_no
    - email_address
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: pii_gated
  rule: pii output fields must be redacted when caller lacks can_view_pii.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
- id: office_name_narrows_only
  rule: >-
    A user-named office may only narrow within authorized_scope. It is bound
    into the approved SQL and ANDed after the authorized office_ids predicate,
    never post-filtered in Rust, so naming an office outside the caller's scope
    returns no rows rather than data or an existence signal.
- id: office_name_is_exact_not_hierarchical
  rule: >-
    office_name matches the office's own name exactly (case-insensitive). Child
    offices are NOT included; every returned row carries office_name so the
    scope actually applied is visible in the output.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
  office_name:
    type: string
    required: false
    user_may_override: true
