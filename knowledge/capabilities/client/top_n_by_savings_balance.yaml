id: client_top_n_by_savings_balance
status: approved_mvp
domain: client
display_name: Top Clients by Savings Balance
description: Return clients with the highest total savings balance across their active savings holdings
  within the caller's authorized office scope.
data_areas:
- client_foundation
- organization_foundation
required_api_capability: client_top_n_by_savings_balance
query_id: client.top_n_by_savings_balance
metrics:
- savings.balance_total
output_mode: top_n
request_shape:
  operation: rank
  subject: client
  grouping: none
  output: ranking
  pii: client_identity
examples:
- Top 10 clients by savings balance.
- Which clients hold the highest savings balances?
- Show top 5 clients by savings balance in IDR.
- Nasabah dengan saldo tabungan tertinggi.
supported_intents:
- ranking clients by total savings balance
- top N depositors by balance
unsupported_intents:
- individual client identity lookup by name
- client contact details
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  max_limit: 100
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: pii_gated
  rule: pii output fields must be redacted when caller lacks can_view_pii.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  currency_code:
    type: string
    required: false
  limit:
    type: integer
    required: false
    default: "10"
    hard_cap: 100
