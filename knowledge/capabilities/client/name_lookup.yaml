id: client_name_lookup
status: approved_mvp
domain: client
display_name: Client Name Lookup
description: Find clients whose display name matches a supplied person name within the caller's authorized
  office scope.
data_areas:
- client_foundation
- organization_foundation
required_api_capability: client_name_lookup
query_id: client.name_lookup
metrics:
- client.name_lookup
output_mode: list
request_shape:
  operation: lookup
  subject: client
  grouping: none
  output: lookup
  pii: client_identity
examples:
- ada gak nama Tony di client kita?
- Find client named Tony.
- Search client by display name.
supported_intents:
- client identity lookup by person name
unsupported_intents:
- raw account number lookup
- external id lookup
guards:
  require_office_scope: true
  pii:
    returns_pii: true
    never_return:
    - account_no
    - external_id
    - mobile_no
    - email
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  search:
    type: string
    required: true
