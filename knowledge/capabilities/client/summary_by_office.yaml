id: client_summary_by_office
status: approved_mvp
domain: client
display_name: Client Summary by Office
description: Return active, pending, closed, and total client counts per office within the caller's authorized
  scope.
data_areas:
- client_foundation
- organization_foundation
required_api_capability: client_summary_by_office
query_id: client.summary_by_office
metrics:
- client.lifecycle_count
output_mode: top_n
request_shape:
  operation: rank
  subject: office
  grouping: office
  output: ranking
  pii: none
examples:
- Show client breakdown per office.
- How many active clients does each office have?
- Client lifecycle counts across my offices (top 20).
supported_intents:
- client lifecycle counts grouped by office
unsupported_intents:
- client identity lookup
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
pii:
  returns_pii: false
cost_class: low
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: no_pii_output
  rule: query output fields must not expose client identity.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 10000
