id: organization_office_client_summary
status: approved_mvp
domain: organization
display_name: Office Client Summary
description: Return office population totals and client lifecycle counts (active, pending, closed, total)
  within the caller's authorized scope, including offices without clients.
data_areas:
- organization_foundation
- client_foundation
required_api_capability: organization_office_client_summary
query_id: organization.office_client_summary
metrics:
- client.lifecycle_count
output_mode: top_n
request_shape:
  operation: rank
  subject: office
  grouping: office
  output: ranking
  pii: none
examples:
- Show client counts per office.
- Office client summary top 20.
- Office population and client count summary.
- Jumlah total nasabah untuk setiap kantor.
- Client counts for Head Office.
supported_intents:
- client lifecycle counts grouped by office
unsupported_intents:
- client identity lookup by name
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  max_limit: 200
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: no_pii_output
  rule: query output fields must not expose client identity.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
- id: office_name_narrows_only
  rule: >-
    A user-named office may only narrow within authorized_scope. It is bound
    into the approved SQL and ANDed after the authorized office_ids predicate,
    never post-filtered in Rust, so naming an office outside the caller's scope
    returns no rows rather than data or an existence signal.
- id: office_name_is_exact_not_hierarchical
  rule: >-
    office_name matches the office's own name exactly (case-insensitive). Child
    offices are NOT included; every returned row carries office_name so the
    scope actually applied is visible in the output.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 200
  office_name:
    type: string
    required: false
    user_may_override: true
