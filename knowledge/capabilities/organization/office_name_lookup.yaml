id: organization_office_name_lookup
status: approved_mvp
domain: organization
display_name: Organization Office Name Lookup
description: Check whether an office with a given name exists in the caller's authorized scope, returning the matching office count, root office count, oldest opening date and active staff count.
data_areas:
  - organization_foundation
required_api_capability: organization_office_name_lookup
query_id: organization.office_name_lookup
metrics:
  - organization.office_count
  - organization.active_staff_count
output_mode: summary
request_shape:
  operation: summary
  subject: office
  grouping: none
  output: summary
  pii: none
examples:
  - Is there an office named Head Office?
  - How many offices are named Branch A?
  - Apakah ada office dengan nama Kantor Pusat?
  - Cek apakah kantor bernama Cabang Bandung ada.
supported_intents:
  - check whether an office with a given name exists
  - count offices matching an office name
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  snapshot_only: true
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: office_name_narrows_only
    rule: office_name may only narrow within authorized_scope; it must never widen it.
  - id: no_pii_output
    rule: query output fields must not expose staff identity.
dataset_recipe:
  dataset_id: organization.office_summary
  shape_id: summary
  filters:
    - filter_id: office_name
      operator: eq
      parameter: office_name
parameters:
  office_name:
    type: string
    required: true
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
