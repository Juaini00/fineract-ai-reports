id: organization_office_identity_resolve
status: approved_mvp
domain: organization
display_name: Office Identity Resolve
# Internal resolver capability: it exists only so the `organization.offices`
# `office_candidates` resolver shape has an approved_mvp capability + query
# behind it, the same pattern as client_identity_resolve. The workflow
# compiler stamps this capability id onto a ResolveEntity node whenever a
# parameter declares an `authorized_data_probe` against that shape.
# `continuation: true` keeps it out of first-turn classifier selection — it
# is never asked for directly, only used as a probe target that feeds the
# §4 office_id filters.
kind: resolver
continuation: true
description: Resolve candidate offices by name within the caller's authorized office scope, returning office id and safe label fields for entity selection.
data_areas: [organization_foundation]
required_api_capability: organization_office_identity_resolve
query_id: organization.office_candidates
metrics: [organization.office_count]
output_mode: list
request_shape: { operation: lookup, subject: office, grouping: none, output: lookup, pii: none }
examples:
  - Resolve the office to continue.
supported_intents:
  - resolve an office entity by name within authorized office scope
guards:
  require_office_scope: true
dataset_recipe:
  dataset_id: organization.offices
  shape_id: office_candidates
  projection: [office_id, office_name, parent_office_id, opening_date]
parameters:
  office_ids: { type: integer_array, required: false, default: authorized_scope, user_may_override: false }
