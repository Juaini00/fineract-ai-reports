id: organization_office_dormant
status: approved_mvp
domain: organization
display_name: Dormant Offices
description: Return offices with zero savings transactions in a given date range within the caller's authorized
  scope, oldest first.
data_areas:
- organization_foundation
required_api_capability: organization_office_dormant
query_id: organization.office_dormant
metrics:
- organization.office_count
output_mode: top_n
request_shape:
  operation: rank
  subject: office
  grouping: office
  output: ranking
  pii: none
examples:
- Which offices had no activity this quarter?
- List dormant offices from 2026-04-01 to 2026-06-30.
supported_intents:
- offices with no savings transaction activity in a date range
unsupported_intents:
- staff activity or client identity
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  max_date_range_days: 366
  max_limit: 100
cost_class: medium
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: no_pii_output
  rule: query output fields must not expose client identity.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  from_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  to_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 100
