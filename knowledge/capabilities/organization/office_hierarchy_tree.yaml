id: organization_office_hierarchy_tree
status: approved_mvp
domain: organization
display_name: Office Hierarchy Tree
description: Return authorized offices as a walkable tree with parent_id and depth per node, ordered by path.
data_areas:
  - organization_foundation
required_api_capability: organization_office_hierarchy_tree
query_id: organization.office_hierarchy_tree
metrics:
  - organization.office_count
output_mode: top_n
examples:
  - Show my office hierarchy tree.
  - List offices with parent and depth.
  - Office org structure top 200.
supported_intents:
  - office hierarchy walk with parent and depth per node
unsupported_intents:
  - staff identity by office
required_parameters:
  - limit
optional_parameters:
  - office_ids
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  max_limit: 500
pii:
  returns_pii: false
cost_class: low
clarification:
  missing_parameters:
    - limit
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: required_parameters_match_query
    rule: required_parameters must be declared as required query parameters.
  - id: no_pii_output
    rule: query output fields must not expose client identity.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
