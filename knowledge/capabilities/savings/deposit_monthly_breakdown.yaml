id: savings_deposit_monthly_breakdown
status: approved_mvp
domain: savings
data_areas:
- organization_foundation
- client_foundation
- savings_core
- savings_transactions
required_api_capability: savings_deposit_monthly_breakdown
query_id: savings.deposit_monthly_breakdown
metrics:
- savings.deposit_amount
- savings.deposit_count
output_mode: monthly_breakdown
request_shape:
  operation: trend
  subject: savings_transaction
  grouping: month
  output: time_series
  pii: none
examples:
- Monthly deposit totals from January to September 2026.
- Show savings deposits per month for this year.
- Month-by-month deposit breakdown.
- Berapa setoran tabungan per bulan dari Januari sampai September.
defaults:
  exclude_reversed: true
guards:
  require_office_scope: true
  max_date_range_days: 366
cost_class: medium
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: monthly_range_bounded
  rule: max_date_range_days must bound the monthly breakdown period.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  from_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  to_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  currency_code:
    type: string
    required: false
  product_ids:
    type: integer_array
    required: false
