id: savings_client_activity
status: approved_mvp
domain: savings
display_name: Savings Client Activity
# Replaces the retired account_activity/account_match fixture (013 §5): that
# shape required an exact client name, product name, and latest transaction
# amount all at once (012 #9 flagged it fixture-specific). This capability
# self-resolves client_id via an authorized data probe against
# client.identity (same pattern as client_relationship_by_id), then executes
# the client's non-reversed savings transactions directly — one probe, no
# second account-level resolution stage, which stays inside the compiler's
# current one-probe-per-capability limit while still answering 012 scenario
# A1 (client -> account activity) since the account id is a returned column.
continuation: true
description: Non-reversed savings transactions for a client resolved by name, newest first, within the caller's authorized office scope.
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
required_api_capability: savings_client_activity
query_id: savings.activity_by_client
metrics:
  - savings.transaction_count
output_mode: list
request_shape:
  operation: list
  subject: savings_transaction
  grouping: none
  output: list
  pii: client_identity
examples:
  - Show savings activity for client John Doe.
  - What savings transactions has this client made?
supported_intents:
  - list a named client's savings transactions
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
  pii:
    returns_pii: true
    never_return:
      - account_no
      - external_id
      - mobile_no
      - email_address
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: pii_gated
    rule: client identity fields must be redacted when caller lacks can_view_pii.
  - id: dataset_recipe_valid
    rule: dataset recipe IDs, filters, and projection must resolve against the approved dataset.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  client_id:
    type: integer
    required: true
    resolution: [authorized_data_probe]
    probe:
      dataset_id: client.identity
      shape_id: identity_candidates
      output_slot: client_id
dataset_recipe:
  dataset_id: savings.transactions
  shape_id: activity_rows
  filters:
    - filter_id: client_id
      operator: eq
      parameter: client_id
  projection:
    - savings_transaction_id
    - savings_account_id
    - client_id
    - client_display_name
    - transaction_type_enum
    - transaction_date
    - amount
    - running_balance
