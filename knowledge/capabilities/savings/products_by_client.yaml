id: savings_products_by_client
status: approved_mvp
domain: savings
display_name: Savings Products By Client
description: List the distinct savings products held by a named client, within the caller's authorized office scope.
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
# client_id self-resolves via an authorized data probe (same per-client probe
# pattern as client_relationship_by_id), so the parameter is never extracted
# from a first-turn example sentence. continuation: true keeps it out of the
# example-executability acceptance check for the same reason relationship_by_id
# is excluded.
continuation: true
required_api_capability: savings_products_by_client
query_id: savings.products_by_client
metrics:
  - savings.account_count
output_mode: list
request_shape:
  operation: list
  subject: product
  grouping: none
  output: list
  pii: none
examples:
  - What savings products does John Doe hold?
  - List the savings products for this client.
  - Produk tabungan apa saja yang dimiliki nasabah ini?
supported_intents:
  - list distinct savings products held by one named client
defaults:
  authorized_scope_only: true
guards:
  require_office_scope: true
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: dataset_recipe_valid
    rule: dataset recipe IDs, filters, and projection must resolve against the approved dataset.
parameters:
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  # Self-resolves via an authorized data probe against client.identity,
  # the same per-client product probe pattern as client_relationship_by_id.
  client_id:
    type: integer
    required: true
    resolution: [authorized_data_probe]
    probe:
      dataset_id: client.identity
      shape_id: identity_candidates
      output_slot: client_id
dataset_recipe:
  dataset_id: savings.products
  shape_id: products_by_client
  filters:
    - filter_id: client_id
      operator: eq
      parameter: client_id
  projection:
    - savings_product_id
    - savings_product_name
    - client_id
    - currency_code
    - deposit_type_enum
    - nominal_annual_interest_rate
