id: savings_deposit_total
status: approved_mvp
domain: savings
display_name: Savings Deposit Total
description: Answer total savings deposits for a date range within the caller's authorized office scope.
data_areas:
- organization_foundation
- client_foundation
- savings_core
- savings_transactions
required_api_capability: savings_deposit_total
query_id: savings.deposit_total
metrics:
- savings.deposit_amount
- savings.deposit_count
output_mode: total
request_shape:
  operation: total
  subject: savings_transaction
  grouping: none
  output: scalar
  pii: none
examples:
- What is the total deposit this month?
- Total deposits from January to September 2026.
- How much savings deposit did we receive today?
supported_intents:
- total savings deposits by date range
- total deposits for authorized offices
- total deposits filtered by currency or savings product
unsupported_intents:
- row-level depositor identity
- account number lookup
- payment reference lookup
defaults:
  exclude_reversed: true
  transaction_type_enum: 1
guards:
  require_office_scope: true
  max_date_range_days: 366
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: output_fields_match_query
  rule: output_fields must exactly match query output_fields names.
- id: no_pii_output
  rule: all declared query output fields must have public_business sensitivity.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  from_date:
    type: date
    required: false
    default: start_of_month(business_today)
    fill_when_missing: true
  to_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  currency_code:
    type: string
    required: false
  product_ids:
    type: integer_array
    required: false
