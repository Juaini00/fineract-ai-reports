id: savings_deposit_monthly_top_n
status: approved_mvp
domain: savings
data_areas:
- organization_foundation
- client_foundation
- savings_core
- savings_transactions
required_api_capability: savings_deposit_monthly_top_n
query_id: savings.deposit_monthly_top_n
metrics:
- savings.deposit_amount
output_mode: monthly_top_n
request_shape:
  operation: rank
  subject: savings_transaction
  grouping: month
  output: ranking
  pii: conditional_client_identity
examples:
- Largest deposit for each month from January to September 2026.
- Top 3 deposits per month this year.
- Show the biggest savings deposit per month.
- Setoran terbesar setiap bulan tahun ini.
- Largest deposit transaction each month.
defaults:
  exclude_reversed: true
  default_limit: 1
guards:
  require_office_scope: true
  max_date_range_days: 366
  max_limit_per_month: 20
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: required_parameters_match_query
  rule: required_parameters must be declared as required query parameters.
- id: monthly_top_n_bounded
  rule: max_limit_per_month must bound row count per month.
- id: pii_fields_are_conditional
  rule: PII output fields require can_view_pii and explicit capability approval.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  from_date:
    type: date
    required: false
    default: business_today - 12m
    fill_when_missing: true
  to_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  currency_code:
    type: string
    required: false
  product_ids:
    type: integer_array
    required: false
  limit:
    type: integer
    required: false
    default: "10"
    hard_cap: 10000
