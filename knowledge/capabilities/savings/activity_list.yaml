id: savings_activity_list
status: approved_mvp
domain: savings
display_name: Savings Activity List
description: Return recent savings transactions for a date range within the caller's authorized office
  scope.
data_areas:
- organization_foundation
- client_foundation
- savings_core
- savings_transactions
required_api_capability: savings_activity_list
query_id: savings.activity_list
metrics:
- savings.deposit_amount
- savings.withdrawal_amount
output_mode: list
request_shape:
  operation: list
  subject: savings_transaction
  grouping: none
  output: list
  pii: conditional_client_identity
examples:
- Show customer savings activity this month.
- List savings transactions this week.
- Show all savings activity for authorized offices.
supported_intents:
- savings activity list by date range
- recent savings transactions for authorized offices
defaults:
  exclude_reversed: true
guards:
  require_office_scope: true
  max_date_range_days: 366
  max_limit: 100
cost_class: medium
checks:
- id: query_exists
  rule: query_id must exist in knowledge/queries.
- id: list_bounded
  rule: max_limit must bound returned rows.
- id: office_scope_required
  rule: query must declare office_ids from authorized_scope and require_office_filter=true.
parameters:
  from_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  to_date:
    type: date
    required: false
    default: business_today
    fill_when_missing: true
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  currency_code:
    type: string
    required: false
  product_ids:
    type: integer_array
    required: false
  limit:
    type: integer
    required: false
    default: unbounded
    hard_cap: 100
