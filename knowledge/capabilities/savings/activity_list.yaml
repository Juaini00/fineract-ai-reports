id: savings_activity_list
status: approved_mvp
domain: savings
display_name: Savings Activity List
description: Return recent savings transactions for a date range within the caller's authorized office scope.
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
required_api_capability: savings_activity_list
query_id: savings.activity_list
metrics:
  - savings.deposit_amount
  - savings.withdrawal_amount
output_mode: list
request_shape:
  operation: list
  subject: savings_transaction
  grouping: none
  output: list
  pii: conditional_client_identity
examples:
  - Show customer savings activity this month.
  - List savings transactions this week.
  - Show all savings activity for authorized offices.
supported_intents:
  - savings activity list by date range
  - recent savings transactions for authorized offices
required_parameters:
  - from_date
  - to_date
  - limit
optional_parameters:
  - office_ids
  - currency_code
  - product_ids
defaults:
  exclude_reversed: true
guards:
  require_office_scope: true
  max_date_range_days: 366
  max_limit: 100
pii:
  returns_pii: conditional
  allowed_fields_when_can_view_pii:
    - client_id
    - client_display_name
  omitted_when_cannot_view_pii:
    - client_id
    - client_display_name
  never_return:
    - account_no
    - external_id
    - ref_no
    - payment_detail_id
cost_class: medium
clarification:
  missing_parameters:
    - from_date
    - to_date
    - limit
output_fields:
  public:
    - transaction_id
    - transaction_date
    - transaction_type
    - amount
    - currency_code
    - office_id
    - office_name
    - product_id
    - product_name
  pii_conditional:
    - client_id
    - client_display_name
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: list_bounded
    rule: max_limit must bound returned rows.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
