id: savings_withdrawal_total
status: approved_mvp
domain: savings
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_transactions
required_api_capability: savings_withdrawal_total
query_id: savings.withdrawal_total
metrics:
  - savings.withdrawal_amount
  - savings.withdrawal_count
output_mode: total
request_shape:
  operation: total
  subject: savings_transaction
  grouping: none
  output: scalar
  pii: none
examples:
  - What is the total withdrawal this month?
  - Total savings withdrawal from January to September 2026.
  - How much money was withdrawn today?
  - Berapa total penarikan bulan ini?
required_parameters:
  - from_date
  - to_date
optional_parameters:
  - office_ids
  - currency_code
  - product_ids
defaults:
  exclude_reversed: true
guards:
  require_office_scope: true
  max_date_range_days: 366
pii:
  returns_pii: false
cost_class: low
clarification:
  missing_parameters:
    - from_date
    - to_date
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: required_parameters_match_query
    rule: required_parameters must be declared as required query parameters.
  - id: no_pii_output
    rule: all declared query output fields must have public_business sensitivity.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
