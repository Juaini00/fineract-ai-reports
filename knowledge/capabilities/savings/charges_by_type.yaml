id: savings_charges_by_type
status: approved_mvp
domain: savings
display_name: Savings Charges By Charge Type
description: List savings account charges of one named charge type, e.g. every "Weekly Charge" applied to a savings account, within the caller's authorized office scope.
data_areas:
  - organization_foundation
  - client_foundation
  - savings_core
  - savings_charges_fees
required_api_capability: savings_charges_by_type
query_id: savings.charges_by_type
metrics:
  - savings.charge_amount_outstanding
output_mode: list
request_shape:
  operation: list
  subject: savings_account_charge
  grouping: none
  output: list
  pii: client_identity
examples:
  - Show all charges of type Weekly Charge on savings accounts.
  - List savings charges named Monthly Fee.
  - Berikan saya semua charge dengan tipe weekly charge pada saving.
  - Tampilkan biaya tabungan bertipe penalty fee.
supported_intents:
  - list savings charges narrowed to one charge type
  - show charges of a named fee on savings accounts
defaults:
  authorized_scope_only: true
  default_limit: 50
guards:
  require_office_scope: true
  max_limit: 200
  pii:
    returns_pii: true
    never_return:
      - account_no
      - external_id
      - mobile_no
      - email_address
checks:
  - id: query_exists
    rule: query_id must exist in knowledge/queries.
  - id: office_scope_required
    rule: query must declare office_ids from authorized_scope and require_office_filter=true.
  - id: charge_type_bound
    rule: charge_name must reach SQL as a bound dataset filter, never as a discarded hint.
  - id: pii_gated
    rule: client identity fields must be redacted when caller lacks can_view_pii.
dataset_recipe:
  dataset_id: savings.account_charges
  shape_id: recent_list
  filters:
    - filter_id: charge_name
      operator: eq
      parameter: charge_name
parameters:
  charge_name:
    type: string
    required: true
  office_ids:
    type: integer_array
    required: false
    default: authorized_scope
    user_may_override: false
  limit:
    type: integer
    required: false
    default: "50"
    hard_cap: 200
