default_rules:
  - Use value 1 for MVP deposit reporting.
  - Exclude reversed transactions separately with is_reversed = false.
  - Do not infer debit or credit without this enum mapping.
checks:
  - id: deposit_value_declared
    rule: value 1 must map to deposit for approved MVP deposit capabilities.
  - id: candidate_values_not_executable
    rule: candidate, secondary, and deferred transaction types must not be used by approved_mvp capabilities until promoted.
  - id: reversed_filter_separate
    rule: reversal handling must use is_reversed/is_reversal flags, not transaction type alone.
