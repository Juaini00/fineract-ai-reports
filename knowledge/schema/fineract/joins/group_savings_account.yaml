id: fineract.joins.group_savings_account
description: Group-owned savings account join path.
status: conditional
data_areas:
  - group_center_foundation
  - savings_core
joins:
  - from: m_savings_account.group_id
    to: m_group.id
    type: left
  - from: m_group.office_id
    to: m_office.id
    type: left
rule: Use only when group_center_foundation is enabled.
checks:
  - id: conditional_join
    rule: this join must not be required by approved_mvp queries unless group_center_foundation is enabled.
  - id: group_tables_declared
    rule: queries using this join must declare m_savings_account and m_group.
