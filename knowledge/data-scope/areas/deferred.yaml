id: deferred_areas
status: deferred_group
source_doc: docs/reporting-data-scope.md#4-deferred-data-areas
description: Group wrapper for individually-defined deferred data areas.
members:
  - loans
  - accounting_gl
  - tax
  - custom_datatables
