id: savings_charges_fees
status: secondary
source_doc: docs/reporting-data-scope.md#36-savings-charges-and-fees
detail_doc: docs/reporting-data/savings-charges-fees.md
description: Savings charges, fees, penalties, paid amounts, waived amounts, and outstanding amounts.
included_tables:
  - m_savings_account_charge
  - m_savings_account_charge_paid_by
  - m_charge
conditional_tables:
  - m_savings_product_charge
excluded_tables: []
allowed_domains:
  - savings
default_rules:
  - Charge metrics and the account-charge creation timestamp are approved only where a capability declares their exact output semantics; created_on_utc may order recent-charge lists but is not a business date.
checks:
  - id: secondary_not_executable_without_capability
    rule: secondary tables must not be used by approved_mvp queries until a capability is approved.
  - id: charge_metrics_semantics_declared
    rule: charge and fee metrics must declare approved output semantics before use.
