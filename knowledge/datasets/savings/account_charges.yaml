id: savings.account_charges
database: fineract
source_sql: queries/datasets/savings/account_charges.source.sql
tables:
  - m_savings_account_charge
  - m_savings_account
  - m_client
  - m_office
  - m_charge
filters:
  - id: charge_name
    expr: charge_name
    type: string
    case_insensitive: true
    operators: [eq]
  - id: is_penalty
    expr: is_penalty
    type: boolean
    operators: [eq]
  - id: due_date
    expr: due_date
    type: date
    operators: [eq, lt, gte]
  - id: currency_code
    expr: currency_code
    type: string
    case_insensitive: true
    operators: [eq]
  # Narrows within the caller's authorized offices; it never widens them.
  # Office scope itself stays bound from authorized_scope in the source SQL.
  - id: office_name
    expr: office_name
    type: string
    case_insensitive: true
    operators: [eq]
  # m_savings_account_charge has no direct office_id; office is reached via
  # the existing client join (c.office_id, selected as office_id).
  - id: office_id
    expr: office_id
    type: integer
    operators: [eq, in]
  - id: savings_account_id
    expr: savings_account_id
    type: integer
    operators: [eq, in]
  - id: client_id
    expr: client_id
    type: integer
    operators: [eq, in]
  - id: charge_definition_id
    expr: charge_definition_id
    type: integer
    operators: [eq, in]
# A presentation label for currency_code, which is filterable. Narrowing by
# "Rp" instead of "IDR" would be a second spelling of the same predicate.
# savings_account_charge_id is this dataset's own row id, display-only.
filters_exempt:
  - currency_display_symbol
  - savings_account_charge_id
shapes:
  - id: recent_list
    request_shape:
      operation: list
      subject: savings_account_charge
      grouping: none
      output: list
      pii: client_identity
    row_cap: 200
    fragment: queries/datasets/savings/account_charges.recent_list.frag.sql
    output_fields:
      - { name: client_id, type: bigint, sensitivity: public_business, core: true }
      - { name: client_display_name, type: string, sensitivity: pii, core: true }
      - { name: office_id, type: bigint, sensitivity: public_business, core: true }
      - { name: office_name, type: string, sensitivity: public_business, core: true }
      - { name: savings_account_id, type: bigint, sensitivity: public_business, core: true }
      - { name: savings_account_charge_id, type: bigint, sensitivity: public_business, core: true }
      - { name: charge_definition_id, type: bigint, sensitivity: public_business, core: true }
      - { name: charge_name, type: string, sensitivity: public_business, core: true }
      - { name: is_penalty, type: boolean, sensitivity: public_business, core: true }
      - { name: charge_timing_enum, type: integer, sensitivity: public_business, core: true }
      - { name: currency_code, type: string, sensitivity: public_business, core: true }
      - { name: currency_digits, type: integer, sensitivity: public_business, core: true }
      - { name: currency_display_symbol, type: string, sensitivity: public_business, core: true }
      - { name: amount_due_current, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_paid, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_waived, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_written_off, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_levied_total, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_outstanding, type: decimal, sensitivity: public_business, core: true }
      - { name: due_date, type: date, sensitivity: public_business, core: true }
    parameters:
      - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
      - { name: limit, type: integer, required: true }
  - id: pending_clients
    request_shape:
      operation: list
      subject: savings_account_charge
      grouping: none
      output: list
      pii: client_identity
    row_cap: 200
    fragment: queries/datasets/savings/account_charges.pending_clients.frag.sql
    output_fields:
      - { name: client_id, type: bigint, sensitivity: public_business, core: true }
      - { name: client_display_name, type: string, sensitivity: pii, core: true }
      - { name: office_id, type: bigint, sensitivity: public_business, core: true }
      - { name: office_name, type: string, sensitivity: public_business, core: true }
      - { name: savings_account_id, type: bigint, sensitivity: public_business, core: true }
      - { name: savings_account_charge_id, type: bigint, sensitivity: public_business, core: true }
      - { name: charge_definition_id, type: bigint, sensitivity: public_business, core: true }
      - { name: charge_name, type: string, sensitivity: public_business, core: true }
      - { name: is_penalty, type: boolean, sensitivity: public_business, core: true }
      - { name: charge_timing_enum, type: integer, sensitivity: public_business, core: true }
      - { name: currency_code, type: string, sensitivity: public_business, core: true }
      - { name: currency_digits, type: integer, sensitivity: public_business, core: true }
      - { name: currency_display_symbol, type: string, sensitivity: public_business, core: true }
      - { name: amount_due_current, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_paid, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_waived, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_written_off, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_levied_total, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_outstanding, type: decimal, sensitivity: public_business, core: true }
      - { name: due_date, type: date, sensitivity: public_business, core: true }
      - { name: days_overdue, type: bigint, sensitivity: public_business, core: true }
    parameters:
      - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
      - { name: as_of_date, type: date, required: true }
      - { name: limit, type: integer, required: true }
  - id: overdue_clients
    request_shape:
      operation: list
      subject: savings_account_charge
      grouping: none
      output: list
      pii: client_identity
    row_cap: 200
    fragment: queries/datasets/savings/account_charges.overdue_clients.frag.sql
    output_fields:
      - { name: client_id, type: bigint, sensitivity: public_business, core: true }
      - { name: client_display_name, type: string, sensitivity: pii, core: true }
      - { name: office_id, type: bigint, sensitivity: public_business, core: true }
      - { name: office_name, type: string, sensitivity: public_business, core: true }
      - { name: savings_account_id, type: bigint, sensitivity: public_business, core: true }
      - { name: savings_account_charge_id, type: bigint, sensitivity: public_business, core: true }
      - { name: charge_definition_id, type: bigint, sensitivity: public_business, core: true }
      - { name: charge_name, type: string, sensitivity: public_business, core: true }
      - { name: is_penalty, type: boolean, sensitivity: public_business, core: true }
      - { name: charge_timing_enum, type: integer, sensitivity: public_business, core: true }
      - { name: currency_code, type: string, sensitivity: public_business, core: true }
      - { name: currency_digits, type: integer, sensitivity: public_business, core: true }
      - { name: currency_display_symbol, type: string, sensitivity: public_business, core: true }
      - { name: amount_due_current, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_paid, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_waived, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_written_off, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_levied_total, type: decimal, sensitivity: public_business, core: true }
      - { name: amount_outstanding, type: decimal, sensitivity: public_business, core: true }
      - { name: due_date, type: date, sensitivity: public_business, core: true }
      - { name: days_overdue, type: bigint, sensitivity: public_business, core: true }
    parameters:
      - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
      - { name: as_of_date, type: date, required: true }
      - { name: limit, type: integer, required: true }
  # "ada berapa charge tipe X" is operation=summary/output=scalar. Without this
  # shape the only charge capabilities were lists, so a count question was
  # answered with a table of clients (issue 011).
  - id: type_count
    request_shape:
      operation: summary
      subject: savings_account_charge
      grouping: none
      output: scalar
      pii: none
    row_cap: 1
    fragment: queries/datasets/savings/account_charges.type_count.frag.sql
    output_fields:
      - { name: charge_count, type: bigint, sensitivity: public_business, core: true }
      - { name: savings_account_count, type: bigint, sensitivity: public_business, core: true }
      - { name: amount_outstanding_total, type: decimal, sensitivity: public_business, core: true }
    parameters:
      - { name: office_ids, type: array_bigint, required: true, source: authorized_scope }
timeout_ms: 3000
