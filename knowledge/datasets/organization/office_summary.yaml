id: organization.office_summary
database: fineract
source_sql: queries/organization/office_summary.sql
tables:
  - m_office
  - m_staff
filters: []
shapes:
  - id: summary
    request_shape:
      operation: summary
      subject: office
      grouping: none
      output: summary
      pii: none
output_fields:
