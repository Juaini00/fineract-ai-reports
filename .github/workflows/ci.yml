name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # Fast checks — fail early, cache aggressively.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Compilation gate.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked

  # Unit tests — no infrastructure required.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins --locked

  # Integration tests — real Postgres (pgvector) service; Redis disabled by
  # the harness so we don't need it here. Fineract read-only DB is faked by a
  # separate empty Postgres database in the same service — safe because the
  # test suite is structured to avoid queries that require actual Fineract
  # data (catalog validation is skipped when schema is empty).
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create Fineract stub database
        run: |
          PGPASSWORD=password psql -h 127.0.0.1 -U root -d postgres \
            -c "CREATE DATABASE fineract_stub;"
      - name: Run integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgres://root:password@127.0.0.1:5432/postgres
          TEST_FINERACT_DATABASE_URL: postgres://root:password@127.0.0.1:5432/fineract_stub
        run: cargo test --workspace --tests --locked

  # Supply-chain audit — advisories + licenses + bans.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Aggregate status check that branch protection can require in one rule.
  ci-passes:
    name: CI passes
    if: always()
    needs: [fmt, clippy, build, unit-tests, integration-tests, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          jq -e '
            [.[].result] as $r |
            all($r[]; . == "success")
          ' <<< '${{ toJson(needs) }}'
